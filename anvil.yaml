metadata:
  description: Build a talking, bilingual agent from one expert's notes. Every answer is drafted from their sources and approved
    by them before it goes live.
  logo_img: asset:icon-512.png
  title: 'Agent Studio: expert-approved AI agents with a face'
name: Agent Studio
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=1ef0581b66"></script>
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/pitchrxchainge.json and run seo.py, not here) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="expert approved chatbot, ai avatar builder, bilingual chatbot english french, talking avatar agent, knowledge base chatbot with approval, chatbot that doesn&#x27;t make things up, montreal restaurant guide chatbot, faq agent with versions and rollback, agent builder for experts, ai face for customer questions">
    <meta name="author" content="Arkvital">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Agent Studio">
    <meta property="og:title" content="Agent Studio: expert-approved AI agents with a face">
    <meta property="og:description" content="Build a talking, bilingual agent from one expert&#x27;s notes. Every answer is drafted from their sources and approved by them before it goes live.">
    <meta property="og:locale" content="en_CA">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Agent Studio: expert-approved AI agents with a face">
    <meta name="twitter:description" content="Build a talking, bilingual agent from one expert&#x27;s notes. Every answer is drafted from their sources and approved by them before it goes live.">
    <noscript><div class="seo-noscript">
    <h1>Agent Studio: expert-approved AI agents with a face</h1>
    <p>Build a talking, bilingual agent from one expert&#x27;s notes. Every answer is drafted from their sources and approved by them before it goes live.</p>
    <p>Agent Studio turns what one expert knows into a talking agent with a face. A producer gives the agent a look, a tone and a voice, adds the expert&#x27;s notes, guides and FAQs, and writes the questions people ask. Each answer is drafted from those sources, in English and in French, and the invited expert approves it before anyone can hear it.</p>
    <p>Publishing freezes the approved answers into a numbered version with a public page anyone can talk to. Questions the agent couldn&#x27;t answer are collected for the team, and any earlier version can be made live again in one click. The agent never invents: if nothing approved fits, it says so and passes the question on. The demo agents are three invented guides to Montreal restaurants.</p>
    <p>Who it's for: Teams that want to put one expert&#x27;s knowledge in front of the public as a talking agent, with the expert approving every answer</p>
    <h2>What it does</h2><ul><li>Avatar studio: face, hair, glasses, accessories, colours, voice speed and pitch</li><li>Sources pasted or uploaded as text, in English or French</li><li>Answers drafted from the sources, naming the sources used</li><li>English and French side by side for every question and answer</li><li>Expert review queue: approve or ask for changes with a note</li><li>Only approved answers reach the public agent</li><li>Versions with one-click rollback</li><li>Public chat page with a lip-synced face and optional voice</li><li>Unanswered questions collected and turned into new topics</li><li>Templates to start from, and polite refusals for off-limits subjects</li></ul>
    <h2>Questions</h2><h3>Can the agent make things up?</h3><p>No. It answers only with topics the expert approved. If nothing fits, it says it doesn&#x27;t know yet and logs the question for the team.</p><h3>Does it use an AI model?</h3><p>Not in this version. Drafting picks the sentences from your sources that fit the question, and matching uses plain rules, behind the expert&#x27;s approval.</p><h3>Does it work in French?</h3><p>Yes. Every question and answer is written in English and French, and visitors switch languages in the chat.</p><h3>Are the demo restaurant guides real people?</h3><p>No. The guides and their experts are invented. The restaurants are real and described with general facts only: check opening hours before you go.</p>
    <p><a href="/about">About Agent Studio</a> &middot; <a href="/llms.txt">Agent Studio for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. Agent Studio needs JavaScript in your browser.</p>
    </div></noscript>
    <!-- seo:end -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F7F5F2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=5cbf3f68f7">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=6dd21616fb">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="strzmf4" data-button="false" data-label="Submit feedback" async></script>
    <link rel="stylesheet" href="_/theme/icons.css?v=8f508d76cd">
    <link rel="stylesheet" href="_/theme/app.css?v=aefa2d6c0f">
    <script src="_/theme/as-face.js?v=85377162c8"></script>
    <script src="_/theme/app-kit.js?v=3a1ad105d5"></script>
package_name: Agent_Studio
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/secrets.yml
startup:
  module: startup
  type: module
