<div class="ui ex-dialog">
  <h2 class="dlg-h">The expert</h2>
  <p class="muted">The person whose knowledge the agent carries. Once invited, only they can approve answers. They sign in (or create an account) with this email and find the agent under "Agents you review".</p>
  <div class="ui-stack">
    <label class="ui-field"><span>Name</span>
      <anvil-component type="TextBox" name="name_box" prop:placeholder="Hélène Gagnon"></anvil-component>
    </label>
    <label class="ui-field"><span>Email</span>
      <anvil-component type="TextBox" name="email_box" prop:placeholder="name@example.com" prop:type="email"></anvil-component>
    </label>
    <label class="ui-field"><span>Title <em>(shown under their name)</em></span>
      <anvil-component type="TextBox" name="title_box" prop:placeholder="Food writer"></anvil-component>
    </label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row between">
      <anvil-component type="Button" name="remove_button" prop:text="Remove the expert" prop:role='["btn", "btn-danger", "btn-sm"]'></anvil-component>
      <div class="ui-row">
        <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
        <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
      </div>
    </div>
  </div>
</div>
