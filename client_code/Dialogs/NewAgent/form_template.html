<div class="ui na-dialog">
  <h2 class="dlg-h">New agent</h2>
  <p class="muted">Pick a starting point. A template brings its face, sources and topics along as drafts: your expert approves every answer again before anything goes live.</p>
  <anvil-component type="RepeatingPanel" name="tpl_panel" prop:item_template="Agent_Studio.Items.TemplateCard" prop:role='["tpl-grid"]'></anvil-component>
  <label class="ui-field na-name"><span>Name</span>
    <anvil-component type="TextBox" name="name_box" prop:placeholder="For example: Mireille"></anvil-component>
  </label>
  <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="create_button" prop:text="Create agent" prop:role='["btn", "btn-primary", "ic-plus"]'></anvil-component>
  </div>
</div>
