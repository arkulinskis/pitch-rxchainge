<div class="ui pd">
  <h2 class="dlg-h">Publish a new version</h2>
  <anvil-component type="Label" name="lead" prop:role='["pd-lead"]'></anvil-component>
  <label class="ui-field"><span>What changed? <em>(shown in the version list)</em></span>
    <anvil-component type="TextBox" name="note_box" prop:placeholder="Added the brunch topics"></anvil-component>
  </label>
  <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="publish_button" prop:text="Publish now" prop:role='["btn", "btn-primary", "ic-globe"]'></anvil-component>
  </div>
</div>
