<div class="ar-host">
<div class="ar" anvil:name="row">
  <span class="ar-dot" aria-hidden="true"></span>
  <div class="grow">
    <div class="ar-top">
      <anvil-component type="Label" name="label" prop:role='["ar-label"]' bind:text="self.item['label']"></anvil-component>
      <anvil-component type="Label" name="when" prop:role='["fine-print"]'></anvil-component>
    </div>
    <anvil-component type="Label" name="topic" prop:role='["ar-topic"]'></anvil-component>
    <anvil-component type="Label" name="detail" prop:role='["fine-print", "ar-detail"]'></anvil-component>
    <anvil-component type="Label" name="actor" prop:role='["ar-actor"]'></anvil-component>
  </div>
</div>
</div>
