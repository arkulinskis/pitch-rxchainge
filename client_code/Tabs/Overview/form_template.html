<div class="tb ov">
  <div class="ov-grid">
    <div class="ui-card flat ov-main">
      <h2 class="tb-h">Identity</h2>
      <p class="muted tb-lead">Who the agent is and how it opens a conversation. English and French sit side by side: both go live together.</p>
      <div class="bi">
        <label class="ui-field"><span>Name</span>
          <anvil-component type="TextBox" name="name_box"></anvil-component>
        </label>
        <label class="ui-field"><span>Subject <em>(what it knows about)</em></span>
          <anvil-component type="TextBox" name="domain_box" prop:placeholder="Montréal's classic restaurants"></anvil-component>
        </label>
      </div>
      <div class="bi">
        <label class="ui-field"><span>Tagline <em>English</em></span>
          <anvil-component type="TextBox" name="tag_en"></anvil-component>
        </label>
        <label class="ui-field" lang="fr"><span>Slogan <em>français</em></span>
          <anvil-component type="TextBox" name="tag_fr"></anvil-component>
        </label>
      </div>
      <div class="bi">
        <label class="ui-field"><span>Greeting <em>English</em></span>
          <anvil-component type="TextArea" name="greet_en" prop:height="96"></anvil-component>
        </label>
        <label class="ui-field" lang="fr"><span>Accueil <em>français</em></span>
          <anvil-component type="TextArea" name="greet_fr" prop:height="96"></anvil-component>
        </label>
      </div>
      <label class="ui-field ov-tone"><span>Tone of voice <em>(drafts open in this tone)</em></span>
        <anvil-component type="DropDown" name="tone_dd"></anvil-component>
      </label>
      <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
      <div class="ui-row end">
        <anvil-component type="Button" name="save_button" prop:text="Save identity" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
      </div>
    </div>
    <div class="ov-side">
      <div class="ui-card flat">
        <h2 class="tb-h">Getting it live</h2>
        <div class="ov-bar" role="progressbar" aria-label="Steps done" anvil:name="bar_box"><i anvil:name="bar"></i></div>
        <anvil-component type="Label" name="progress_label" prop:role='["fine-print"]'></anvil-component>
        <anvil-component type="RepeatingPanel" name="steps_panel" prop:item_template="Agent_Studio.Items.CheckStep" prop:role='["ov-steps"]'></anvil-component>
      </div>
      <div class="ui-card flat ov-expert">
        <h2 class="tb-h">Expert</h2>
        <anvil-component type="Label" name="expert_name" prop:role='["strong"]'></anvil-component>
        <anvil-component type="Label" name="expert_line" prop:role='["fine-print"]'></anvil-component>
        <anvil-component type="Button" name="expert_button" prop:text="Invite the expert" prop:role='["btn", "btn-sm", "ic-mail"]'></anvil-component>
      </div>
      <div class="ui-card flat ov-stats">
        <div><anvil-component type="Label" name="asked_num" prop:role='["stat-num"]'></anvil-component><span class="muted small">questions asked of the live agent</span></div>
        <div><anvil-component type="Label" name="gaps_num" prop:role='["stat-num"]'></anvil-component><span class="muted small">still unanswered</span></div>
      </div>
      <anvil-component type="Button" name="delete_button" prop:text="Delete this agent" prop:role='["btn", "btn-danger", "btn-sm", "ic-trash"]'></anvil-component>
    </div>
  </div>
</div>
